name: Cleanup old NexStore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git rm -rf --ignore-unmatch NexStore NexStore.xcodeproj
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -m "Remove old NexStore files" || echo "nothing to remove"
          git push
