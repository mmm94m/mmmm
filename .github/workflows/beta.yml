name: Beta Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build:
    name: Build Beta
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch dependencies (submodules)
        run: |
          rm -rf Zsign IDeviceKit StosSign
          git clone --recurse-submodules --branch package https://github.com/khcrysalis/Zsign-Package Zsign
          git clone --recurse-submodules https://github.com/khcrysalis/IDeviceKit IDeviceKit
          git clone --recurse-submodules https://github.com/NovaDev404/StosSign StosSign
          git -C Zsign checkout 6ffe703 || true
          git -C IDeviceKit checkout 837cf1e || true
          git -C StosSign checkout bcd7e5f || true
          ls Zsign IDeviceKit StosSign | head -30

      - name: Build
        run: |
          set -o pipefail
          make 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "=========== ERRORS ==========="
          grep -E "error:|: error|The following build commands failed|Failed to build|failed with a nonzero" -A3 build.log | head -120 || true

      - name: Update Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_OFFICIAL_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "## Commit: \`$COMMIT_MSG\` (${{ github.sha }})" >> release_notes.md
          echo "### New in this build (Compared to $LATEST_OFFICIAL_TAG):" >> release_notes.md
            
          CHANGES=$(git log --pretty=format:"* %s (%h)" ${LATEST_OFFICIAL_TAG}..HEAD)
            
          if [ -z "$CHANGES" ]; then
            echo "* No code changes since $LATEST_OFFICIAL_TAG" >> release_notes.md
          else
            echo "$CHANGES" >> release_notes.md
          fi
          
          echo "### Commit SHA: ${{ github.sha }}" >> release_notes.md
          
          cat release_notes.md

          gh release delete beta --cleanup-tag -y || true
          
          gh release create beta "packages/AshteMobile.ipa" \
            --title "Latest Beta Build" \
            --notes "$(cat release_notes.md)" \
            --prerelease \
            --target ${{ github.sha }}
